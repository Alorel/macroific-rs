[package]
name = "macroific_macro"
description = "Proc macros for the macroific crate"
keywords = []
categories = []
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
include.workspace = true

[lib]
proc-macro = true

[features]
attr_parse = [
  "dep:macroific_attr_parse",
  "macroific_core/generic-impl",
  "macroific_core/module-prefix",
]

[dependencies]
macroific_core = { version = "3.0.1", path = "../macroific-core" }
macroific_attr_parse = { optional = true, version = "3.0.1", path = "../macroific-attr-parse" }

proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
