[package]
name = "macroific_core"
version = "3.0.1"
edition = "2021"
rust-version = "1.71.0"
authors = [
  "Art <amolc@pm.me>",
]
license = "Apache-2.0"
readme = "README.md"
description = "Shared functionality for macroific & macroific_macro"
repository = "https://github.com/Alorel/macroific-rs"
keywords = []
categories = []
include = [
  "src/",
  "Cargo.toml",
]

[features]
attributed = []
generic-impl = []
module-prefix = []

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
sealed = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
syn = { workspace = true, features = ["extra-traits"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
